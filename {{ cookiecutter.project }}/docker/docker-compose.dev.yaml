services:
  db:
    image: postgres:15-alpine
    container_name: {{ cookiecutter.project }}-dev-db
    env_file: 
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-{{ cookiecutter.project }}}
      POSTGRES_USER: ${DB_USER:-{{ cookiecutter.project }}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-{{ cookiecutter.project }}}
    ports:
      - "5432:5432"   # 本机连接: localhost:5432
    volumes:
      - {{ cookiecutter.project }}_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-{{ cookiecutter.project }}} -d ${DB_NAME:-{{ cookiecutter.project }}}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {{ cookiecutter.project }}-network

  redis:
    image: redis:7.4.5-alpine
    container_name: {{ cookiecutter.project }}-dev-redis
    env_file:
      - ../.env
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"   # 本机连接: localhost:6379
    volumes:
      - {{ cookiecutter.project }}_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {{ cookiecutter.project }}-network

volumes:
  {{ cookiecutter.project }}_db:
  {{ cookiecutter.project }}_redis:

networks:
  {{ cookiecutter.project }}-network:
    driver: bridge
