networks:
  # 注意！要在启动容器前创建nginx_net
  nginx_net:
    external: true

# 启动一个空Nginx服务
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      # 根据实际情况调整服务器上端口
      - "80:80"
    # 以后加 HTTPS:
    # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vhosts/:/etc/nginx/conf.d/:ro
    networks:
      - nginx_net