worker_processes 4;

events {
    worker_connections 1024;
}

http {
    
    upstream {{cookiecutter.project}} {
        server 127.0.0.1:8000;
    }

    server {
        listen      80;
        server_name myapp.example.com;

        # URL:server_name/{{ cookiecutter.project }}/static/
        location ^~ /{{ cookiecutter.project }}/static/  {
            alias /static/{{ cookiecutter.project }}/;
            expires 10d;
        }

        # URL:server_name/{{ cookiecutter.project }}/media/
        location ^~ /{{ cookiecutter.project }}/media/  {
            alias /media/{{ cookiecutter.project }}/;
            expires 10d;
        }
        
        {% if cookiecutter.use_async %}
        location /{{ cookiecutter.project }}/ {
            include            /etc/nginx/uwsgi_params;
            uwsgi_pass         {{ cookiecutter.project }};
            uwsgi_param        Host $host;
            uwsgi_param        X-Real-IP $remote_addr;
            uwsgi_param        X-Forwarded-For $proxy_add_x_forwarded_for;
            uwsgi_param        X-Forwarded-Proto $http_x_forwarded_proto;
        }
        {% else %}
        location /{{ cookiecutter.project }}/ {
            proxy_pass         http://{{cookiecutter.project}};
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        {% endif %}
    }
}