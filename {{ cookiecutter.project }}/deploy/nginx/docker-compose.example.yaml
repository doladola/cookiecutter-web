networks:
  nginx_net:
    external: true

# 注意：这里声明为 external: true 的卷，需提前由各站点 compose 创建
volumes:
  site1_static:
    external: true
  site1_media:
    external: true

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      # 根据实际情况调整服务器上端口
      - "80:80"
    # 如果启用 HTTPS，还需映射 443 端口，并配置证书:
    # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vhosts/:/etc/nginx/conf.d/:ro
      # 站点静态/媒体卷挂载（一个站点一对）
      - site1_static:/sites/site1/static:ro
      - site1_media:/sites/site1/media:ro
    networks:
      - nginx_net